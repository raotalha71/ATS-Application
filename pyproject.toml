[project]
name = "resume-ats-platform"
version = "1.0.0"
description = "Resume ATS Intelligence Platform — rule-based scoring + LLM + FAISS RAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    "pymupdf==1.24.3",
    "python-docx==1.1.0",
    "faiss-cpu==1.8.0",
    "sentence-transformers==3.0.0",
    "numpy==1.26.4",
    "ollama==0.2.1",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "pydantic==2.7.1",
    "torch", 
    "pydantic-settings==2.2.1",
    "aiofiles==23.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "httpx==0.27.0",
]
